name: Windows build and regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the application and run regression tests
        run: .\build.ps1 -RunTests

      - name: Prepare the Windows package
        run: |
          $packageDir = Join-Path $PWD 'bin\package'
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item 'bin\Comb.exe', 'bin\Probe.exe', 'README.md', 'LICENSE' -Destination $packageDir
          Copy-Item 'docs' -Destination $packageDir -Recurse
          $sourceCommit = git rev-parse HEAD
          @(
            ('Source commit: ' + $sourceCommit),
            ('Workflow: https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID),
            'Automated checks: Windows build, hotkey recovery regression, window placement regression.',
            'Physical sleep/resume and multi-monitor validation are still required. See docs/validation.md.'
          ) | Set-Content -LiteralPath (Join-Path $packageDir 'BUILD.txt') -Encoding UTF8

      - name: Upload the tested build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Comb-windows-${{ github.sha }}
          path: bin/package/
          if-no-files-found: error
          retention-days: 14
